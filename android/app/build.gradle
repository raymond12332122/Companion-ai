apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "ai.companion.pixel"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.companion.pixel"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // MediaPipe's GenAI task pulls in guava and protobuf; together with
        // Capacitor and AndroidX that lands close enough to the 64K method
        // limit that a single added dependency later would break the build.
        multiDexEnabled true
        ndk {
            // tasks-genai ships ~26 MB of native libraries per ABI, four ABIs,
            // and every one of them goes into the APK unless filtered. These
            // two cover real hardware (every 64-bit Android phone) and the
            // standard emulator image; armeabi-v7a and x86 would add ~51 MB
            // to serve 32-bit devices that cannot hold a 2 GB model in memory
            // anyway.
            abiFilters 'arm64-v8a', 'x86_64'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Java target is set by the generated capacitor.build.gradle (applied
    // below, re-generated on every `cap sync`/`cap update`) — currently 21.
    // kotlinOptions here just has to track whatever that says, or Kotlin and
    // Java class files come out targeting different bytecode versions and
    // compileDebugKotlin refuses to run.
    kotlinOptions {
        jvmTarget = "21"
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    // The android.jar on the unit-test classpath stubs org.json to throw, so
    // the real implementation has to be supplied for StructuredReply's tests
    // to exercise the parser instead of the stub.
    testImplementation "org.json:json:20250107"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // --- CompanionLocalLlm plugin ---
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // LiteRT-LM, packaged for Android as MediaPipe's LLM Inference task. There
    // is no `com.google.ai.edge.litert:litert-lm` artifact to depend on — that
    // repository publishes a C++ runtime and this is how it reaches Android.
    // Version is pinned, not `+`: a floating version on a dependency carrying
    // 26 MB of native code per ABI turns an unrelated build into a silent
    // engine swap.
    implementation "com.google.mediapipe:tasks-genai:$mediapipeGenAiVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
