name: Deploy Which Uma Are You to GitHub Pages

# Deploys the static site in which-uma-are-you/ to GitHub Pages.
#
# One-time manual step required (not automatable via this workflow):
# in the repo's Settings -> Pages, set "Build and deployment" -> Source
# to "GitHub Actions". After that, every push here (or a manual run via
# the Actions tab) publishes automatically.

on:
  push:
    branches:
      - claude/install-caveman-skill-1rgdul
    paths:
      - 'which-uma-are-you/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: which-uma-are-you

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
