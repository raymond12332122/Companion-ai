<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Which Uma Are You? — Quiz</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <a href="index.html" class="top-link">← Exit quiz</a>

    <div class="quiz-header">

        <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
      </div>
      <div class="progress-label" id="progress-label">Question 1 of 15</div>
    </div>

    <div class="question-card">

      <div class="question-text" id="question-text"></div>
      <div class="answers-list" id="answers-list"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="prev-btn">← Previous</button>
      <button class="btn btn-primary" id="next-btn" disabled>Next →</button>
    </div>
  </div>

  <script type="module" src="js/quiz.js"></script>
</body>
</html>
