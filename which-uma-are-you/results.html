<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>Which Uma Are You? — Your Result</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <a href="index.html" class="top-link">← Back to home</a>

    <div id="result-content">
      <!-- populated by JS -->
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="retake-btn">Take Quiz Again</button>
    </div>

    <p class="footer-note">
      Results are a fun approximation based on your answers, not an official
      or scientific measurement.
    </p>
  </div>

  <script src="data.js"></script>
  <script>
    const STORAGE_KEY = 'uma-quiz-answers';

    function loadAnswers() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length === QUESTIONS.length) {
            return parsed;
          }
        }
      } catch (e) {
        /* corrupted storage */
      }
      return null;
    }

    /* --- Scoring --------------------------------------------------- */

    function computeMaxPossible() {
      const max = {};
      TRAITS.forEach((t) => (max[t] = 0));
      QUESTIONS.forEach((q) => {
        TRAITS.forEach((t) => {
          let best = 0;
          q.answers.forEach((a) => {
            const w = a.weights[t] || 0;
            if (w > best) best = w;
          });
          max[t] += best;
        });
      });
      return max;
    }

    function computeRawUserScores(answers) {
      const raw = {};
      TRAITS.forEach((t) => (raw[t] = 0));
      QUESTIONS.forEach((q, i) => {
        const choiceIndex = answers[i];
        if (choiceIndex === null || choiceIndex === undefined) return;
        const weights = q.answers[choiceIndex].weights;
        TRAITS.forEach((t) => {
          raw[t] += weights[t] || 0;
        });
      });
      return raw;
    }

    function normalizeUser(raw, max) {
      const norm = {};
      TRAITS.forEach((t) => {
        norm[t] = max[t] > 0 ? raw[t] / max[t] : 0;
      });
      return norm;
    }

    function normalizeCharacter(character) {
      const norm = {};
      TRAITS.forEach((t) => {
        norm[t] = (character.profile[t] || 0) / 10;
      });
      return norm;
    }

    function cosineSimilarity(a, b) {
      let dot = 0, normA = 0, normB = 0;
      TRAITS.forEach((t) => {
        dot += a[t] * b[t];
        normA += a[t] * a[t];
        normB += b[t] * b[t];
      });
      if (normA === 0 || normB === 0) return 0;
      return dot / (Math.sqrt(normA) * Math.sqrt(normB));
    }

    /* --- Rendering --------------------------------------------------- */

    function initials(name) {
      return name
        .split(' ')
        .map((w) => w[0])
        .join('')
        .toUpperCase();
    }

    function renderResult(userNorm, matches) {
      const best = matches[0];
      const others = matches.slice(1);
      const container = document.getElementById('result-content');

      const traitRows = TRAITS.map((t) => {
        const pct = Math.round(userNorm[t] * 100);
        return `
          <div class="trait-row">
            <div class="trait-row-top">
              <span>${t}</span>
              <span>${pct}%</span>
            </div>
            <div class="trait-track">
              <div class="trait-fill" data-pct="${pct}"></div>
            </div>
          </div>
        `;
      }).join('');

      const otherRows = others
        .map((m) => {
          const pct = Math.round(m.score * 100);
          return `
            <div class="other-match-row">
              <span class="other-match-dot" style="background:${m.character.color}"></span>
              <span class="other-match-name">${m.character.name}</span>
              <span class="other-match-pct">${pct}%</span>
            </div>
          `;
        })
        .join('');

      const bestPct = Math.round(best.score * 100);

      container.innerHTML = `
        <div class="result-hero">
          <span class="badge">🏆 Your Match</span>
          <div class="character-portrait" style="background:${best.character.color}">
            ${initials(best.character.name)}
          </div>
          <div class="character-name">${best.character.name}</div>
          <div class="character-tagline">${best.character.tagline}</div>
        </div>

        <div class="character-blurb">
          ${best.character.blurb}
          <br /><br />
          You matched <span class="match-score">${bestPct}%</span> with ${best.character.name}.
        </div>

        <div class="section-title">Your Trait Profile</div>
        <div class="trait-bars">
          ${traitRows}
        </div>

        <div class="section-title">Other Close Matches</div>
        <div class="other-matches">
          ${otherRows}
        </div>
      `;

      /* animate bars in after paint */
      requestAnimationFrame(() => {
        document.querySelectorAll('.trait-fill').forEach((el) => {
          el.style.width = el.getAttribute('data-pct') + '%';
        });
      });
    }

    function renderEmptyState() {
      const container = document.getElementById('result-content');
      container.innerHTML = `
        <div class="result-hero">
          <span class="badge">⚠️ No Answers Found</span>
          <h2 style="margin-top:16px;">Take the quiz first!</h2>
          <p style="color:var(--text-dim); margin-top:10px;">
            We couldn't find any saved answers. Start the quiz to get your result.
          </p>
        </div>
      `;
      document.getElementById('retake-btn').textContent = 'Start Quiz';
    }

    /* --- Main --------------------------------------------------- */

    const answers = loadAnswers();

    if (!answers || answers.some((a) => a === null || a === undefined)) {
      renderEmptyState();
    } else {
      const max = computeMaxPossible();
      const raw = computeRawUserScores(answers);
      const userNorm = normalizeUser(raw, max);

      const matches = CHARACTERS.map((character) => ({
        character,
        score: cosineSimilarity(userNorm, normalizeCharacter(character))
      })).sort((a, b) => b.score - a.score);

      renderResult(userNorm, matches);
    }

    document.getElementById('retake-btn').addEventListener('click', () => {
      localStorage.removeItem(STORAGE_KEY);
      window.location.href = 'quiz.html';
    });
  </script>
</body>
</html>
